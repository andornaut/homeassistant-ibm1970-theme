# IBM1970 Theme - An IBM and 1970s inspired theme
# Based on: https://github.com/andornaut/ibm1970-desktop-theme
# See: https://github.com/home-assistant/frontend/tree/dev/src/resources/theme/color
ibm1970:
  accent-color: "#33a999" # Teal
  app-header-background-color: "var(--sidebar-background-color)"
  app-header-edit-background-color: "#b05533"
  app-header-text-color: "var(--sidebar-text-color)"
  ha-color-fill-primary-normal-resting: "var(--secondary-text-color)"
  label-badge-green: "var(--accent-color)"
  primary-color: "var(--ha-color-primary-80)"
  scrollbar-thumb-color: "var(--sidebar-background-color)"
  sidebar-icon-color: "var(--sidebar-text-color)"
  sidebar-selected-icon-color: "var(--primary-text-color)"
  sidebar-selected-text-color: "var(--primary-text-color)"
  state-icon-color: "var(--secondary-text-color)"
  state-cover-active-color: "var(--amber-color)"
  switch-checked-track-color: "var(--disabled-color)"
  switch-unchecked-button-color: "var(--scrollbar-thumb-color)"
  switch-unchecked-track-color: "var(--scrollbar-thumb-color)"
  text-primary-color: "var(--card-background-color)"

  # WebAwesome button colors
  wa-color-on-normal: "var(--primary-text-color)"
  wa-color-fill-normal: "var(--primary-color)"
  wa-color-neutral-on-normal: "var(--secondary-text-color)"
  wa-color-neutral-fill-normal: "var(--secondary-background-color)"

  modes:
    dark:
      # Core colors
      disabled-color: "#9c9977"
      disabled-text-color: "#7c7755"

      # HA color scale
      ha-color-on-primary-normal: "var(--ha-color-primary-95)" # The default is 60, which is too low contrast
      ha-color-primary-05: "#24201a"
      ha-color-primary-10: "#2d2a1f"
      ha-color-primary-20: "#373424"
      ha-color-primary-30: "#423f2e"
      ha-color-primary-40: "#545040"
      ha-color-primary-50: "#7c7755"
      ha-color-primary-60: "#9c9977"
      ha-color-primary-70: "#afac8f"
      ha-color-primary-80: "#c1bfa8"
      ha-color-primary-90: "#d4d2c0"
      ha-color-primary-95: "#dddccc"

      # Background hierarchy
      primary-background-color: "#423f2e" # Main background
      card-background-color: "#545040" # Card surfaces
      secondary-background-color: "#373424" # Alternative areas

      # Text colors
      primary-text-color: "#dddccc"
      secondary-text-color: "#9c9977"

      # Sidebar
      sidebar-background-color: "#7c7755"
      sidebar-text-color: "#24201a"

      # States
      amber-color: "#fdd93c"
      error-color: "#d30102"

      switch-checked-button-color: "var(--ha-color-primary-80)"
    light:
      # Core colors
      #      primary-color: "#7c7755" # vscode button.background
      disabled-color: "#646050"
      disabled-text-color: "#9c9977"

      # HA color scale (mirror of dark)
      ha-color-on-primary-normal: "var(--ha-color-primary-05)" # The default is 40, which is too low contrast
      ha-color-primary-05: "#dddccc"
      ha-color-primary-10: "#d4d2c0"
      ha-color-primary-20: "#c1bfa8"
      ha-color-primary-30: "#afac8f"
      ha-color-primary-40: "#9c9977"
      ha-color-primary-50: "#7c7755"
      ha-color-primary-60: "#545040"
      ha-color-primary-70: "#423f2e"
      ha-color-primary-80: "#373424"
      ha-color-primary-90: "#2d2a1f"
      ha-color-primary-95: "#24201a"

      # Background hierarchy
      primary-background-color: "#c1bfa8" # Main background
      card-background-color: "#afac8f" # Card surfaces
      secondary-background-color: "#dddccc" # Alternative areas

      # Text colors
      primary-text-color: "#373424"
      secondary-text-color: "#545040"

      # Sidebar
      sidebar-background-color: "#9c9977"
      sidebar-text-color: "#423f2e"

      # States
      amber-color: "#fdd93c"
      error-color: "#d30102"

      ha-color-on-disabled-quiet: "var(--ha-color-primary-40)"
      switch-checked-button-color: "var(--ha-color-primary-50)"
